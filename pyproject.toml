[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-vpn-bot"
version = "1.0.0"
description = "Telegram bot for free VLESS subscriptions backed by Xray"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.0,<4",
  "aiohttp>=3.9,<4",
]

[tool.setuptools]
packages = ["free_vpn_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
